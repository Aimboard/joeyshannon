<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JoeyShannon · joeyshannon.ndjp.net</title>
<meta name="description" content="JoeyShannon — a small corner of the internet.">
<style>
  :root {
    --bg: #f5f5f7;
    --ink: #1d1d1f;
    --sub: #6e6e73;
    --card: rgba(255, 255, 255, 0.72);
    --line: rgba(0, 0, 0, 0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue",
      "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Segoe UI", Arial, sans-serif;
    background:
      radial-gradient(60rem 40rem at 15% -10%, #dbeafe 0%, transparent 55%),
      radial-gradient(50rem 36rem at 110% 110%, #ffe4e6 0%, transparent 50%),
      var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: var(--card);
    -webkit-backdrop-filter: blur(18px) saturate(1.6);
    backdrop-filter: blur(18px) saturate(1.6);
    border: 1px solid var(--line);
    border-radius: 28px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.08);
    max-width: 560px;
    width: 100%;
    padding: 56px 48px 40px;
    text-align: center;
  }
  .mark {
    font-size: 13px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--sub);
    margin-bottom: 22px;
  }
  h1 {
    font-size: clamp(40px, 8vw, 58px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.08;
  }
  .tagline {
    margin-top: 18px;
    font-size: 18px;
    line-height: 1.6;
    color: var(--sub);
  }
  .tagline .jp { display: block; margin-top: 6px; font-size: 15px; }
  .domain {
    display: inline-block;
    margin-top: 30px;
    padding: 9px 18px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.6);
    font-size: 14px;
    color: var(--ink);
    letter-spacing: 0.02em;
  }
  footer {
    margin-top: 38px;
    font-size: 12.5px;
    color: var(--sub);
  }
  @media (max-width: 480px) {
    .card { padding: 44px 26px 32px; border-radius: 24px; }
    .tagline { font-size: 16px; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">Hello · こんにちは</div>
    <h1>JoeyShannon</h1>
    <p class="tagline">
      A small corner of the internet.
      <span class="jp">インターネットの小さな片隅。</span>
    </p>
    <span class="domain">joeyshannon.ndjp.net</span>
    <footer>© 2026 JoeyShannon</footer>
  </main>
</body>
</html>
